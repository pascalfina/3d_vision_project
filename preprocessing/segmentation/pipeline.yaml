dataset:
  root: "/cluster/project/cvg/data/3RScan"               # ← CAMBIAR
  scene_id: "20c993b7-698f-29c5-847d-c8cb8a685f5a"       # o "all" para todas
  image_subdir: "sequence"
  image_ext: ".color.jpg"
  resize: [960, 540]

keyframes:
  strategy: "stride"             # "stride" | "uniform" | "all"
  stride: 500

sam2:
  model_cfg:  "sam2.1_hiera_l.yaml"
  checkpoint: "/cluster/home/ealegret/3d_vision_project/models/sam2ckpt/sam2.1_hiera_large.pt"
  points_per_side: 32
  pred_iou_thresh: 0.86
  stability_score_thresh: 0.92
  min_mask_region_area: 200
  max_obj_ids: 50

must3r:
  checkpoint: "models/must3r/MUSt3R_512.pth"
  resolution: 512
  min_conf_thr: 1.5
  output_pointmaps: true

output: 
  visualize: true