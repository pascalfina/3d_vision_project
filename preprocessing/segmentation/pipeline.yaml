dataset:
  root: "/cluster/project/cvg/data/3RScan"               # Change
  scene_id: "0ad2d3a1-79e2-2212-9b99-a96495d9f7fe"       # or "all" fir everything
  image_subdir: "sequence"
  image_ext: ".color.jpg"
  resize: [960, 540]

keyframes:
  strategy: "stride"             # "stride" | "uniform" | "all"
  stride: 4

sam2:
  model_cfg:  "sam2.1_hiera_l.yaml"
  checkpoint: "/cluster/home/ealegret/3d_vision_project/models/sam2ckpt/sam2.1_hiera_large.pt"
  points_per_side: 24
  points_per_batch: 64
  pred_iou_thresh: 0.92
  stability_score_thresh: 0.96
  stability_score_offset: 1.0
  box_nms_thresh: 0.40
  crop_n_layers: 1
  crop_n_points_downscale_factor: 2
  min_mask_region_area: 3000
  max_obj_ids: 50
  
must3r:
  checkpoint: "models/must3r/MUSt3R_512.pth"
  resolution: 512
  min_conf_thr: 1.5
  output_pointmaps: true

output: 
  visualize: true