<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pi3X + SAMObject: Geometry and Object Masks</title>
  <style>
    :root {
      --ink: #171c24;
      --muted: #5b6470;
      --border: #d7dde5;
      --bg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "DejaVu Sans", "Aptos", "Segoe UI", sans-serif;
    }

    main {
      width: 1920px;
      height: 1080px;
      margin: 0 auto;
      padding: 24px 26px 28px;
      background: white;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 42px;
      line-height: 1.05;
      letter-spacing: 0.02em;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 6px;
      text-align: center;
      color: var(--muted);
      font-size: 20px;
      letter-spacing: 0.02em;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 24px;
    }

    .panel-title {
      margin: 0 0 12px;
      text-align: center;
      font-size: 30px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .card {
      height: 900px;
      border: 2px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      background: white;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }
  </style>
</head>
<body>
  <main>
    <h1>Pi3X + SAMObject Reconstruction</h1>
    <div class="subtitle">geometry and masks loaded directly from the original interactive HTML viewers</div>

    <section class="grid" aria-label="Pi3X SAMObject reconstruction comparison">
      <article>
        <h2 class="panel-title">Geometry only</h2>
        <div class="card">
          <iframe
            title="Pi3X SAMObject geometry only"
            src="/vis/poster_8f0f144b_geometry_comparison/pi3x_samobject/geometry_only_rgb.html">
          </iframe>
        </div>
      </article>

      <article>
        <h2 class="panel-title">Geometry + masks</h2>
        <div class="card">
          <iframe
            title="Pi3X SAMObject geometry with masks"
            src="/vis/poster_8f0f144b_geometry_comparison/pi3x_samobject/geometry_with_samobject_masks.html">
          </iframe>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
